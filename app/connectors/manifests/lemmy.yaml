key: lemmy
version: 1.0.0
tier: protocol
auth: bot_token
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec:
      title_max_chars: 200
      body_max_chars: 10000
      links_allowed: true
rate_limits:
  per_connection:
    requests: 60
    per_seconds: 60
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "400": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url
