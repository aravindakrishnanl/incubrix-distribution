openapi: 3.1.0
info:
  title: IncuBrix Distribution
  description: Long-Tail Destination Network — connector service and product API
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Process liveness — always 200 if the app is running.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - health
      summary: Ready
      description: Dependency readiness — checks PostgreSQL and storage.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
  /connector/v1/{connector_key}/{method}:
    post:
      tags:
      - connectors
      summary: Connector Dispatch
      description: 'Dispatch a method call to the appropriate connector.


        Request body shape depends on the method (see Appendix A).

        All errors are returned as the canonical error envelope.'
      operationId: connector_dispatch_connector_v1__connector_key___method__post
      security:
      - HTTPBearer: []
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Connector Dispatch Connector V1  Connector Key   Method  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/publish:
    post:
      tags:
      - jobs
      summary: Submit Publish
      description: 'Submit a publish job.


        Requires Idempotency-Key header. Returns 202 with job_id immediately.

        The connector invocation runs asynchronously.'
      operationId: submit_publish_api_v1_publish_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Request Body
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Submit Publish Api V1 Publish Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get Job
      description: Get the status and result of a publish job.
      operationId: get_job_api_v1_jobs__job_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Api V1 Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/manifest:
    get:
      tags:
      - jobs
      summary: Get Job Manifest
      description: Get the machine-readable output manifest (IS-9) for a job.
      operationId: get_job_manifest_api_v1_jobs__job_id__manifest_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Manifest Api V1 Jobs  Job Id  Manifest Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/result:
    get:
      tags:
      - jobs
      summary: Get Job Result
      description: Get job result details.
      operationId: get_job_result_api_v1_jobs__job_id__result_get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Result Api V1 Jobs  Job Id  Result Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations:
    get:
      tags:
      - destinations
      summary: List Destinations
      description: List all destinations in the catalogue with optional filtering.
      operationId: list_destinations_api_v1_destinations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: connector_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - name: active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Destinations Api V1 Destinations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - destinations
      summary: Create Destination
      description: Create a new destination.
      operationId: create_destination_api_v1_destinations_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Destination Api V1 Destinations Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{destination_id}:
    get:
      tags:
      - destinations
      summary: Get Destination
      description: Get a single destination by ID.
      operationId: get_destination_api_v1_destinations__destination_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Destination Api V1 Destinations  Destination Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - destinations
      summary: Update Destination
      description: Update a destination (partial update — only provided fields are
        changed).
      operationId: update_destination_api_v1_destinations__destination_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Destination Api V1 Destinations  Destination
                  Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - destinations
      summary: Update Destination
      description: Update a destination (partial update — only provided fields are
        changed).
      operationId: update_destination_api_v1_destinations__destination_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Destination Api V1 Destinations  Destination
                  Id  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - destinations
      summary: Delete Destination
      description: Deactivate a destination (soft delete — sets active=False).
      operationId: delete_destination_api_v1_destinations__destination_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Destination Api V1 Destinations  Destination
                  Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/bulk:
    post:
      tags:
      - destinations
      summary: Bulk Import Destinations
      description: 'Bulk import destinations from JSON body or CSV file upload.


        - JSON body: POST with Content-Type: application/json, body is a list or dict
        with ''destinations''.

        - CSV file: POST with multipart/form-data, field name ''file'', CSV with header
        row.'
      operationId: bulk_import_destinations_api_v1_destinations_bulk_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Bulk Import Destinations Api V1 Destinations Bulk
                  Post
      security:
      - HTTPBearer: []
  /api/v1/destinations/import:
    post:
      tags:
      - destinations
      summary: Bulk Import Destinations
      description: 'Bulk import destinations from JSON body or CSV file upload.


        - JSON body: POST with Content-Type: application/json, body is a list or dict
        with ''destinations''.

        - CSV file: POST with multipart/form-data, field name ''file'', CSV with header
        row.'
      operationId: bulk_import_destinations_api_v1_destinations_import_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Bulk Import Destinations Api V1 Destinations Import
                  Post
      security:
      - HTTPBearer: []
  /api/v1/connectors:
    get:
      tags:
      - destinations
      summary: List Connectors Route
      description: List all registered connectors with their status.
      operationId: list_connectors_route_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Connectors Route Api V1 Connectors Get
      security:
      - HTTPBearer: []
  /api/v1/connections:
    get:
      tags:
      - connections
      summary: List Connections
      description: List all connections. Credentials are never returned.
      operationId: list_connections_api_v1_connections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: connector_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
      - name: destination_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Connections Api V1 Connections Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - connections
      summary: Create Connection
      description: Create a new connection. Credentials are encrypted at rest.
      operationId: create_connection_api_v1_connections_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Connection Api V1 Connections Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connections/{connection_id}:
    put:
      tags:
      - connections
      summary: Update Connection
      description: Update connection metadata or credentials.
      operationId: update_connection_api_v1_connections__connection_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Connection Api V1 Connections  Connection Id  Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - connections
      summary: Update Connection
      description: Update connection metadata or credentials.
      operationId: update_connection_api_v1_connections__connection_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Update Connection Api V1 Connections  Connection Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - connections
      summary: Get Connection
      description: Get connection metadata (no credentials).
      operationId: get_connection_api_v1_connections__connection_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Connection Api V1 Connections  Connection Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - connections
      summary: Delete Connection
      description: Deactivate a connection (soft delete).
      operationId: delete_connection_api_v1_connections__connection_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Connection Api V1 Connections  Connection Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/connections/{connection_id}/decrypt:
    post:
      tags:
      - connections
      summary: Get Connection Credentials
      description: Retrieve decrypted credentials for a connection (use with caution).
      operationId: get_connection_credentials_api_v1_connections__connection_id__decrypt_post
      security:
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Connection Credentials Api V1 Connections  Connection
                  Id  Decrypt Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/run:
    post:
      tags:
      - certification
      summary: Run Certification Standalone
      operationId: run_certification_standalone_api_v1_certification_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Run Certification Standalone Api V1 Certification
                  Run Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/certify/{destination_id}:
    post:
      tags:
      - certification
      summary: Run Certification
      description: 'Run a certification test against a destination.


        The test sequence: validate → publish → get_status → delete.

        All evidence is stored in the certification_runs table.

        Level is upgraded if all steps pass.'
      operationId: run_certification_api_v1_certify__destination_id__post
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificationRequest'
              default:
                test_title: IncuBrix Certification Test Post
                test_body: This is an automated certification test. It will be deleted
                  immediately.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Run Certification Api V1 Certify  Destination Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - certification
      summary: Get Certification
      description: Get the most recent certification run for a destination.
      operationId: get_certification_api_v1_certify__destination_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Certification Api V1 Certify  Destination Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certification/{run_id}:
    get:
      tags:
      - certification
      summary: Get Certification By Run Id
      description: Get a certification run by run_id.
      operationId: get_certification_by_run_id_api_v1_certification__run_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Certification By Run Id Api V1 Certification  Run
                  Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/certify/{destination_id}/history:
    get:
      tags:
      - certification
      summary: Get Certification History
      description: Get certification run history for a destination.
      operationId: get_certification_history_api_v1_certify__destination_id__history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Certification History Api V1 Certify  Destination
                  Id  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/storage:
    get:
      tags:
      - storage
      summary: Storage Info
      description: Return storage backend configuration (no secrets).
      operationId: storage_info_api_v1_storage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Storage Info Api V1 Storage Get
      security:
      - HTTPBearer: []
components:
  schemas:
    CertificationRequest:
      properties:
        destination_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
        connector_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Connector Key
        target_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Level
        test_title:
          type: string
          title: Test Title
          default: IncuBrix Certification Test Post
        test_body:
          type: string
          title: Test Body
          default: This is an automated certification test. It will be deleted immediately.
        connection:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Connection
      type: object
      title: CertificationRequest
    ConnectionCreate:
      properties:
        connector_key:
          type: string
          title: Connector Key
        destination_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Url
        rate_limit_per_minute:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit Per Minute
        credentials:
          additionalProperties: true
          type: object
          title: Credentials
          default: {}
      type: object
      required:
      - connector_key
      title: ConnectionCreate
    ConnectionUpdate:
      properties:
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Active
        rate_limit_per_minute:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rate Limit Per Minute
        credentials:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Credentials
      type: object
      title: ConnectionUpdate
    DestinationCreate:
